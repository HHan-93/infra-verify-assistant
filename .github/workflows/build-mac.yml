name: Build macOS

# Actions 목록에 남는 실행 제목. 빌드가 여러 개 쌓였을 때 "몇 번 버전의 무슨 빌드인지" 를
# 제목만 보고 가릴 수 있어야 한다 — 수동 실행이면 입력값으로 `Q-Term(2.6.0)_주요 내용` 형태로 짓고,
# 푸시로 돌아간 경우는 비워 두어 GitHub 기본값(커밋 제목)을 그대로 쓴다.
run-name: ${{ inputs.version && format('Q-Term({0})_{1}', inputs.version, inputs.summary) || '' }}

# 수동 실행(Actions 탭의 "Run workflow") 또는 v* 태그 푸시 시 빌드
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 2.6.0) — 실행 제목에 들어간다'
        required: false
      summary:
        description: '주요 업데이트 내용 (한 줄)'
        required: false
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci — 잠금 파일(package-lock.json) 그대로 설치한다. npm install 은 범위 안에서 새 버전을 받아 Windows 로컬 빌드와 다른
      # 의존성으로 Mac 판이 나올 수 있었다(코드 점검 10-30)
      - name: Install dependencies
        run: npm ci

      # 판정 로직 검사 — main 에 푸시하면 이 워크플로가 곧 배포본을 만든다. 검사가 깨진 채 Mac 판이 나가지 않게(코드 점검 10-30)
      - name: Check (판정 로직 검사)
        run: npm run check

      - name: Build (Universal .dmg / .zip)
        # CSC_IDENTITY_AUTO_DISCOVERY=false → 서명 없이 빌드 (Apple Developer 인증서 불필요)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      # v* 태그로 트리거된 경우, GitHub Release 에도 자동 첨부
      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
